name: Build BM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-bm-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_PUBLIC_API_URL: "https://bm.pm.sa/api"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bm-mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: bm-mobile
        run: npm install --legacy-peer-deps

      - name: Generate Android project
        working-directory: bm-mobile
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        working-directory: bm-mobile/android
        run: |
          chmod +x gradlew
          if ./gradlew assembleRelease --no-daemon; then
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          else
            echo "Release build failed; building debug APK instead."
            ./gradlew assembleDebug --no-daemon
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -f "$APK_PATH"
          mkdir -p ../../apk-output
          cp "$APK_PATH" ../../apk-output/BM-Management.apk
          ls -lh ../../apk-output/BM-Management.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BM-Management-APK
          path: apk-output/BM-Management.apk
          if-no-files-found: error
          retention-days: 30
