name: Build BM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-bm-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_PUBLIC_API_URL: "https://bm.pm.sa/api"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: bm-mobile
        run: npm install --legacy-peer-deps

      - name: Generate Android project
        working-directory: bm-mobile
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        working-directory: bm-mobile/android
        run: |
          chmod +x gradlew
          printf '\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\norg.gradle.parallel=false\n' >> gradle.properties
          ./gradlew assembleDebug --no-daemon --max-workers=2
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          mkdir -p ../../apk-output
          cp "$APK_PATH" ../../apk-output/BM-Management.apk
          ls -lh ../../apk-output/BM-Management.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BM-Management-APK
          path: apk-output/BM-Management.apk
          if-no-files-found: error
          retention-days: 30
