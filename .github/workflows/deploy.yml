name: Deploy BM Dev

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy current BM source to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BM_SSH_HOST }}
          username: ${{ secrets.BM_SSH_USER }}
          key: ${{ secrets.BM_SSH_PRIVATE_KEY }}
          port: "${{ secrets.BM_SSH_PORT }}"
          command_timeout: 20m
          script: |
            set -e
            ROOT=/mnt/home-storage/home/pmsa/apps/bm
            MOBILE="$ROOT/bm-mobile"
            API="$ROOT/bm-api"

            cd "$ROOT"
            git fetch origin main
            git reset --hard origin/main

            chown -R pmsa:pmsa "$MOBILE" "$API"
            mkdir -p /home/pmsa/apps/.cache /home/pmsa/apps/.tmp
            chown -R pmsa:pmsa /home/pmsa/apps/.cache /home/pmsa/apps/.tmp

            runuser -u pmsa -- bash -lc "cd '$API' && php -l app/Models/ExpenseAttachment.php && php -l app/Http/Controllers/Api/ExpenseAttachmentController.php && php -l database/migrations/2026_09_24_033500_create_expense_attachments_table.php && php artisan optimize:clear && php artisan migrate --path=database/migrations/2026_09_24_033500_create_expense_attachments_table.php --force && php artisan route:list --path=expense-attachments"
            runuser -u pmsa -- bash -lc "cd '$MOBILE' && npm install --legacy-peer-deps"

            rm -rf /home/pmsa/apps/.tmp/bm-deploy-check
            runuser -u pmsa -- bash -lc "cd '$MOBILE' && EXPO_PUBLIC_API_URL=https://bm.pm.sa/api npx expo export --platform android --output-dir /home/pmsa/apps/.tmp/bm-deploy-check"

            lsof -ti:8083 | xargs -r kill -9 || true
            rm -f /home/pmsa/apps/bm-expo-8083.log

            runuser -u pmsa -- bash -lc "cd '$MOBILE' && nohup setsid env BROWSER=none EXPO_NO_TELEMETRY=1 REACT_NATIVE_PACKAGER_HOSTNAME=pm.sa XDG_CACHE_HOME=/home/pmsa/apps/.cache TMPDIR=/home/pmsa/apps/.tmp TMP=/home/pmsa/apps/.tmp TEMP=/home/pmsa/apps/.tmp npx expo start --clear --go --host lan --port 8083 > /home/pmsa/apps/bm-expo-8083.log 2>&1 < /dev/null >/dev/null 2>&1 &"

            sleep 6
            lsof -iTCP:8083 -sTCP:LISTEN
            curl --fail --silent --show-error --max-time 15 -H "expo-platform: android" -H "expo-protocol-version: 0" http://127.0.0.1:8083/ > /tmp/bm-expo-manifest.json
            grep -q '"sdkVersion":"57.0.0"' /tmp/bm-expo-manifest.json
            echo "BM SDK 57 is running on port 8083."
