name: Sync BM expense types

on:
  push:
    branches:
      - main
    paths:
      - "bm-mobile/App.js"
      - "bm-api/app/Http/Controllers/Api/ExpenseCategoryController.php"
      - "bm-api/app/Models/ExpenseCategory.php"
      - "bm-api/database/migrations/2026_09_23_170000_add_notes_and_active_to_expense_categories.php"
      - ".github/workflows/sync-bm-expense-types.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync expense types UI and API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BM_SSH_HOST }}
          username: ${{ secrets.BM_SSH_USER }}
          key: ${{ secrets.BM_SSH_PRIVATE_KEY }}
          port: "${{ secrets.BM_SSH_PORT }}"
          command_timeout: 10m
          script: |
            set -e
            ROOT=/mnt/home-storage/home/pmsa/apps/bm
            MOBILE="$ROOT/bm-mobile"
            API="$ROOT/bm-api"

            cd "$ROOT"
            git fetch origin main

            git show origin/main:bm-mobile/App.js > /tmp/bm-App.js.new
            install -o pmsa -g pmsa -m 0644 /tmp/bm-App.js.new "$MOBILE/App.js"

            git show origin/main:bm-api/app/Http/Controllers/Api/ExpenseCategoryController.php > /tmp/ExpenseCategoryController.php
            install -o pmsa -g pmsa -m 0644 /tmp/ExpenseCategoryController.php "$API/app/Http/Controllers/Api/ExpenseCategoryController.php"

            git show origin/main:bm-api/app/Models/ExpenseCategory.php > /tmp/ExpenseCategory.php
            install -o pmsa -g pmsa -m 0644 /tmp/ExpenseCategory.php "$API/app/Models/ExpenseCategory.php"

            git show origin/main:bm-api/database/migrations/2026_09_23_170000_add_notes_and_active_to_expense_categories.php > /tmp/2026_09_23_170000_add_notes_and_active_to_expense_categories.php
            install -o pmsa -g pmsa -m 0644 /tmp/2026_09_23_170000_add_notes_and_active_to_expense_categories.php "$API/database/migrations/2026_09_23_170000_add_notes_and_active_to_expense_categories.php"

            php -l "$API/app/Http/Controllers/Api/ExpenseCategoryController.php"
            php -l "$API/app/Models/ExpenseCategory.php"
            php -l "$API/database/migrations/2026_09_23_170000_add_notes_and_active_to_expense_categories.php"

            cd "$API"
            php artisan migrate --path=database/migrations/2026_09_23_170000_add_notes_and_active_to_expense_categories.php --force
            php artisan optimize:clear || true

            grep -q "ExpenseTypeFormModal" "$MOBILE/App.js"
            grep -q "typeDropdownField" "$MOBILE/App.js"
            grep -q "is_active" "$API/app/Http/Controllers/Api/ExpenseCategoryController.php"
            grep -q "base_type" "$API/app/Http/Controllers/Api/ExpenseCategoryController.php"
            grep -q "activeCategoryNames" "$MOBILE/App.js"
            grep -q "الأنواع الأساسية للصرف" "$MOBILE/App.js"

            rm -rf /home/pmsa/apps/.tmp/bm-expense-type-check
            runuser -u pmsa -- bash -lc "cd '$MOBILE' && EXPO_PUBLIC_API_URL=https://bm.pm.sa/api npx expo export --platform android --output-dir /home/pmsa/apps/.tmp/bm-expense-type-check >/tmp/bm-expense-type-check.log 2>&1"
            tail -n 20 /tmp/bm-expense-type-check.log

            lsof -ti:8083 | xargs -r kill -9 || true
            rm -f /home/pmsa/apps/bm-expo-8083.log
            runuser -u pmsa -- bash -lc "cd '$MOBILE' && BROWSER=none EXPO_NO_TELEMETRY=1 REACT_NATIVE_PACKAGER_HOSTNAME=pm.sa XDG_CACHE_HOME=/home/pmsa/apps/.cache TMPDIR=/home/pmsa/apps/.tmp TMP=/home/pmsa/apps/.tmp TEMP=/home/pmsa/apps/.tmp nohup npx expo start --clear --go --host lan --port 8083 > /home/pmsa/apps/bm-expo-8083.log 2>&1 < /dev/null &"

            sleep 6
            lsof -iTCP:8083 -sTCP:LISTEN
            curl --fail --silent --show-error --max-time 15 -H "expo-platform: android" -H "expo-protocol-version: 0" http://127.0.0.1:8083/ > /tmp/bm-expense-type-manifest.json
            grep -q '"sdkVersion":"57.0.0"' /tmp/bm-expense-type-manifest.json
            echo "BM expense type flow is live on port 8083."
