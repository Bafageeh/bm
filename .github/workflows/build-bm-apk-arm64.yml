name: Build BM APK ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-bm-apk-arm64.yml"
      - "bm-mobile/App.js"
      - "bm-mobile/app.json"
      - "bm-mobile/package.json"

jobs:
  build-apk-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      EXPO_PUBLIC_API_URL: "https://bm.pm.sa/api"
      ORG_GRADLE_PROJECT_reactNativeArchitectures: "arm64-v8a"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: bm-mobile
        run: npm install --legacy-peer-deps

      - name: Generate Android project
        working-directory: bm-mobile
        run: npx expo prebuild --platform android --clean

      - name: Build ARM64 release APK
        working-directory: bm-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          mkdir -p ../../apk-output
          cp "$APK_PATH" ../../apk-output/BM-Management.apk
          ls -lh ../../apk-output/BM-Management.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BM-Management-APK
          path: apk-output/BM-Management.apk
          if-no-files-found: error
          retention-days: 30
