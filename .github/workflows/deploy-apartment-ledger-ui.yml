name: Deploy BM apartment ledger UI

on:
  push:
    branches:
      - main
    paths:
      - "bm-mobile/App.js"
      - ".github/workflows/deploy-apartment-ledger-ui.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy apartment ledger UI
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BM_SSH_HOST }}
          username: ${{ secrets.BM_SSH_USER }}
          key: ${{ secrets.BM_SSH_PRIVATE_KEY }}
          port: "${{ secrets.BM_SSH_PORT }}"
          command_timeout: 8m
          script: |
            set -e
            ROOT=/mnt/home-storage/home/pmsa/apps/bm
            MOBILE="$ROOT/bm-mobile"
            COMMIT=${{ github.sha }}

            cd "$ROOT"
            git fetch --no-tags origin "$COMMIT"
            git show "$COMMIT:bm-mobile/App.js" > /tmp/bm-ledger-App.js
            install -o pmsa -g pmsa -m 0644 /tmp/bm-ledger-App.js "$MOBILE/App.js"

            grep -q "كشف الحركة المالية" "$MOBILE/App.js"
            grep -q "saveApartmentPayment" "$MOBILE/App.js"

            rm -rf /home/pmsa/apps/.tmp/bm-ledger-check
            runuser -u pmsa -- bash -lc "cd '$MOBILE' && EXPO_PUBLIC_API_URL=https://bm.pm.sa/api npx expo export --platform android --output-dir /home/pmsa/apps/.tmp/bm-ledger-check >/tmp/bm-ledger-check.log 2>&1"
            tail -n 20 /tmp/bm-ledger-check.log

            lsof -ti:8083 | xargs -r kill -9 || true
            rm -f /home/pmsa/apps/bm-expo-8083.log
            runuser -u pmsa -- bash -lc "cd '$MOBILE' && BROWSER=none EXPO_NO_TELEMETRY=1 REACT_NATIVE_PACKAGER_HOSTNAME=pm.sa XDG_CACHE_HOME=/home/pmsa/apps/.cache TMPDIR=/home/pmsa/apps/.tmp TMP=/home/pmsa/apps/.tmp TEMP=/home/pmsa/apps/.tmp nohup npx expo start --clear --go --host lan --port 8083 > /home/pmsa/apps/bm-expo-8083.log 2>&1 < /dev/null &"

            sleep 6
            lsof -iTCP:8083 -sTCP:LISTEN
            echo "BM apartment ledger UI is live."
