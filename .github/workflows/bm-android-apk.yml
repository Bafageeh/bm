name: Build BM Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'bm-mobile/**'
      - '.github/workflows/bm-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build standalone Release APK without EAS quota
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bm-mobile
    env:
      EXPO_PUBLIC_API_URL: https://bm.pm.sa/api
      NODE_ENV: production
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Apply local project fixes
        run: |
          if [ -f scripts/owner-actions-menu.js ]; then node scripts/owner-actions-menu.js; fi
          if [ -f scripts/add-screen-numbers.js ]; then node scripts/add-screen-numbers.js; fi
          if [ -f scripts/beautify-icons-and-notifications.js ]; then node scripts/beautify-icons-and-notifications.js; fi

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build standalone release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify and rename APK
        run: |
          mkdir -p ../build-output
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Release APK was not generated at $APK_PATH"
            find android/app/build/outputs/apk -maxdepth 3 -type f -name '*.apk' -print || true
            exit 1
          fi
          cp "$APK_PATH" ../build-output/owners-association-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: owners-association-release-apk
          path: build-output/owners-association-release.apk
          if-no-files-found: error
          retention-days: 14
